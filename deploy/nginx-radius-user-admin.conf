server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name radius.your-domain.com;

    ssl_certificate     /etc/ssl/radius-user-admin/fullchain.pem;
    ssl_certificate_key /etc/ssl/radius-user-admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RadiusTLS:10m;
    ssl_session_tickets off;

    allow 192.0.2.0/24;
    allow 198.51.100.0/24;
    allow 203.0.113.0/24;
    deny all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data: https://*.duosecurity.com; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    client_max_body_size 32k;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
