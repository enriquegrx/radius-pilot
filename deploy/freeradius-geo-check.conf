# RadiusPilot country-access enforcement — FreeRADIUS rlm_exec module.
#
# This is the ONLY piece that touches the live authentication path. Install it
# deliberately, and only after the console's monitor mode shows no false
# positives. The hook rejects a login solely when the console geo policy mode is
# "enforce"; in "off"/"monitor" mode, and on any error, it allows the login.
#
# Install
# -------
#   1. Copy this file to the FreeRADIUS modules directory and enable it:
#        install -m 640 -o root -g freerad freeradius-geo-check.conf \
#          /etc/freeradius/3.0/mods-available/geo_check
#        ln -sf ../mods-available/geo_check /etc/freeradius/3.0/mods-enabled/geo_check
#   2. Install the check script (root-owned, world-executable so freerad runs it):
#        install -m 755 -o root -g root radius-pilot-geo-check \
#          /usr/local/sbin/radius-pilot-geo-check
#   3. In the site that performs primary auth (e.g. sites-enabled/default), call
#      `geo_check` near the TOP of the authorize {} section — before mschap/pap
#      and before the Duo step — then reject if it asked to:
#
#        authorize {
#            filter_username
#            preprocess
#            # The redundant wrapper keeps a failed or timed-out hook from ever
#            # affecting the outcome: only an explicit control:Auth-Type := Reject
#            # (which the script emits solely in enforce mode) blocks the login.
#            redundant {
#                geo_check
#                ok
#            }
#            if (&control:Auth-Type == Reject) {
#                reject
#            }
#            ...
#        }
#
#   4. Validate and reload FreeRADIUS:
#        freeradius -C && systemctl reload freeradius
#
# The console writes the resolved per-user allow-lists to
# /etc/freeradius/3.0/radius-pilot-geo-policy.json on every change and reconcile.
# Point RADIUS_ADMIN_GEOIP_MMDB at a GeoLite2 Country .mmdb for worldwide country
# resolution (install python3-maxminddb); without it only well-known ranges
# resolve and everything else is treated as unlocated (allowed under fail-open).

exec geo_check {
    wait = yes
    program = "/usr/local/sbin/radius-pilot-geo-check %{User-Name} %{Calling-Station-Id}"
    input_pairs = request
    output_pairs = control
    shell_escape = yes
    timeout = 5
}
