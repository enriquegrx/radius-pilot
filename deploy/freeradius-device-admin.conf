# RadiusPilot device-administration login — FreeRADIUS virtual server.
#
# Authenticates CLI logins (SSH / console) to routers and switches against the
# accounts RadiusPilot marks as "device admin", completely isolated from the VPN
# authentication path. It authorizes from the generated file
#   /etc/freeradius/3.0/mods-config/files/device-admin/authorize
# (username -> NT hash + shell:priv-lvl=15) and answers with PAP. RadiusPilot
# regenerates that file on every change and reconcile.
#
# Two ways to route the devices, decided at pilot time:
#   * No Duo (start here): the device sends its login RADIUS straight to this
#     virtual server. Proves login + local fallback with the fewest moving parts.
#   * With Duo Push (second pass): point the device at a new Duo Authentication
#     Proxy radius_server_auto integration whose backend is this virtual server,
#     and forward the shell attributes (pass_through_attr_names=Cisco-AVPair).
#
# ALWAYS keep a local break-glass account and enable secret on every device, and
# configure the line method list as `group <radius> local` so a RADIUS outage
# falls back to local instead of locking you out.
#
# Install
# -------
#   1. This file -> /etc/freeradius/3.0/sites-available/device-admin, then
#      ln -sf ../sites-available/device-admin /etc/freeradius/3.0/sites-enabled/
#   2. The files module instance below can live here or in mods-available.
#   3. Add a client for each device (its management IP + a shared secret) with
#      `virtual_server = device-admin` so its requests land here.
#   4. Listen on a free port. The Duo proxy owns 1812 and the FreeRADIUS
#      accounting listener owns 1813, so this uses 1814. Validate and reload:
#        freeradius -C && systemctl restart freeradius

# A dedicated files instance reading the RadiusPilot-generated device-admin file.
files device_admin_files {
    filename = /etc/freeradius/3.0/mods-config/files/device-admin/authorize
}

# Example device client. Repeat per router/switch; keep each secret unique.
# client device-hub {
#     ipaddr = 192.0.2.1
#     secret = <a-strong-unique-shared-secret>
#     nas_type = cisco
#     virtual_server = device-admin
# }

server device-admin {
    listen {
        type = auth
        ipaddr = 192.0.2.10
        port = 1814            # 1812 = Duo proxy, 1813 = accounting, 1814 = free
        clients = device_admin_clients
    }

    authorize {
        preprocess
        device_admin_files
        pap
    }

    authenticate {
        Auth-Type PAP {
            pap
        }
    }

    # Accounting for device logins is optional; add a detail module here if you
    # want CLI login records in the console later.
    accounting {
        ok
    }
}
