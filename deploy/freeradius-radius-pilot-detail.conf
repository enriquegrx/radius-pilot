# FreeRADIUS accounting detail module for RadiusPilot's "online now" view.
#
# Install as /etc/freeradius/3.0/mods-available/radius_pilot_detail and enable
# it with:
#   ln -s ../mods-available/radius_pilot_detail /etc/freeradius/3.0/mods-enabled/
#
# Then reference it in the accounting section of the site that answers the Duo
# Authentication Proxy (usually sites-enabled/default):
#
#   accounting {
#       radius_pilot_detail
#       ...
#   }
#
# The "%t" header writes the ctime line ("Tue Sep  2 08:00:00 2026") that the
# helper's active_sessions() parser expects. The file is a single appended
# stream (not per-client, not date-rotated) so the helper reads one path;
# radius-pilot-detail.logrotate keeps it bounded. FreeRADIUS must be listening
# for accounting on udp/1813 (the default site already does), and the firewall
# must allow 1813/udp from the gateway (see nftables.conf).

detail radius_pilot_detail {
    filename = /var/log/freeradius/radacct/radius-pilot-detail
    header = "%t"
    permissions = 0640
    locking = yes
}
