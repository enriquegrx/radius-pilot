#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    set admin_ipv4 {
        type ipv4_addr
        flags interval
        elements = {
            172.26.200.0/24,
            172.26.201.0/24,
            172.24.24.0/24,
            172.24.28.0/24
        }
    }

    set radius_web_ipv4 {
        type ipv4_addr
        flags interval
        elements = {
            172.26.200.0/24,
            172.26.201.0/24,
            172.24.24.0/24,
            172.24.28.0/24,
            10.10.91.0/24,
            192.168.8.0/24
        }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        ip saddr @admin_ipv4 tcp dport 22 accept
        ip saddr @radius_web_ipv4 tcp dport 443 accept
        ip saddr 172.26.200.1 udp dport 1812 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
