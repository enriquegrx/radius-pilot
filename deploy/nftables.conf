#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    set admin_ipv4 {
        type ipv4_addr
        flags interval
        elements = {
            192.0.2.0/24,
            198.51.100.0/24
        }
    }

    set radius_web_ipv4 {
        type ipv4_addr
        flags interval
        elements = {
            192.0.2.0/24,
            198.51.100.0/24,
            203.0.113.0/24
        }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        ip saddr @admin_ipv4 tcp dport 22 accept
        ip saddr @radius_web_ipv4 tcp dport 443 accept
        ip saddr 192.0.2.1 udp dport 1812 accept
        # RADIUS accounting from the VPN gateway feeds the "online now" view.
        ip saddr 192.0.2.1 udp dport 1813 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
